name: Collect RepoRadar data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector syntax
        run: python -m py_compile scripts/collect.py
      - name: Collect GitHub signals and issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py
      - name: Validate generated datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('data/repositories.json'), Path('data/issues.json'), Path('data/history.json')]:
              json.loads(path.read_text(encoding='utf-8'))
              print('validated', path)
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "reporadar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: refresh RepoRadar signals"
          git push
